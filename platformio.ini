[platformio]
; Build-Artefakte auf die lokale Platte statt aufs SMB-Share: offene
; Datei-Handles anderer Prozesse (z. B. Claude-Sandbox-VM) machten aus
; geloeschten Build-Dateien .smbdelete-Platzhalter -> Deploy-Fehler.
workspace_dir = ~/.pio-workspaces/infinitag-now-target

[env:esp32-s3-devkitc-1]
; espressif32 6.x = Arduino-Core 2.x (alte esp_now-Callback-Signatur,
; wie Core-Lib/Station/Config) – nicht ungefragt auf 3.x heben.
platform    = espressif32 @ ^6.7.0
board       = esp32-s3-devkitc-1
framework   = arduino

; Target-V3.2-PCB: ESP32-S3-WROOM-1 N8R8 -> 8 MB Flash, eigene
; Partitionstabelle mit zwei OTA-Slots (SoftAP-Update, Doc 21)
board_upload.flash_size = 8MB
board_build.partitions  = partitions_8MB.csv

monitor_speed = 115200

; Libraries
;   Adafruit_NeoPixel = 12x SK6812 RGBW LED-Ring (GPIO 38)
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0
    ; Core-Lib als Symlink auf die lokale Arbeitskopie: immer aktueller
    ; Stand, kein Cache-Drift, kein Push noetig. Fuer Builds ausserhalb
    ; des NAS-Setups stattdessen den Tag pinnen:
    ;   https://github.com/Infinitag/infinitag-now-core.git#v3.3.0
    symlink:///Volumes/Basteln/Infinitag/repos/infinitag-now-core
